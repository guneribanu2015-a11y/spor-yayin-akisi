name: Yayın akışını güncelle

on:
  schedule:
    - cron: "0 3,9,15 * * *"   # Türkiye saatiyle 06:00, 12:00, 18:00
  push:
    paths: ["scripts/**", ".github/workflows/guncelle.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-yaz
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 7 günlük maç listesini çek (sporekrani.com)
        run: python3 scripts/sporekrani.py docs/matches.json

      - name: Kaydet
        run: |
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add docs/matches.json
          git diff --cached --quiet && exit 0
          git commit -m "Akış güncellendi $(TZ=Europe/Istanbul date '+%F %H:%M')"
          git pull --rebase origin main
          git push
