name: Yayın akışını güncelle

on:
  schedule:
    - cron: "0 3,15 * * *"   # Türkiye saatiyle 06:00 ve 18:00
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: iptv-org/epg aracını indir
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg && npm install --no-audit --no-fund

      - name: Spor kanallarının akışını çek (3 gün)
        continue-on-error: true   # bir platform düşerse diğerleri yine yazılsın
        run: |
          cd /tmp/epg
          npm run grab --- --channels=$GITHUB_WORKSPACE/sport.channels.xml \
            --output=$GITHUB_WORKSPACE/guides/{site}.xml --days=3 --maxConnections=3 --timeout=20000

      - name: Canlı maçları ayıkla
        run: python3 scripts/parse.py "guides/*.xml" docs/matches.json

      - name: Kaydet
        run: |
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add docs/matches.json
          git diff --cached --quiet || git commit -m "Akış güncellendi $(TZ=Europe/Istanbul date '+%F %H:%M')"
          git push
