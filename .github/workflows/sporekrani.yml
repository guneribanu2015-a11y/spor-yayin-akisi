name: Sporekrani ham veri

on:
  push:
    paths: [".github/workflows/sporekrani.yml"]
  # v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-yaz
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 7 günlük sayfaları indir
        run: |
          mkdir -p raw
          for i in 0 1 2 3 4 5 6; do
            d=$(TZ=Europe/Istanbul date -d "+$i day" +%F)
            curl -sSL -A "Mozilla/5.0" -o raw/$d.html -w "$d %{http_code} %{size_download}\n" "https://www.sporekrani.com/home/day/$d" || true
          done
          d=$(TZ=Europe/Istanbul date -d "+3 day" +%F)
          curl -sS -D raw/hdr.txt -o raw/nofollow.html -A "Mozilla/5.0" "https://www.sporekrani.com/home/day/$d" || true
          curl -sSL -o raw/index.js "https://www.sporekrani.com/assets/index-BYyE6ceV.js" || true
          curl -sSL -o raw/index2.js "https://www.sporekrani.com/assets/index-BMBAvLfp.js" || true
          curl -sSL -o raw/datepicker.js "https://www.sporekrani.com/assets/DatePicker-DVGxC4yY.js" || true
          ls -la raw
      - name: Kaydet
        run: |
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add raw
          git diff --cached --quiet && exit 0
          git commit -m "sporekrani ham sayfalar"
          git pull --rebase origin main
          git push
