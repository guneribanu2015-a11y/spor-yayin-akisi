name: Sporekrani ham veri

on:
  push:
    paths: [".github/workflows/sporekrani.yml"]
  # v5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-yaz
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 7 günlük sayfaları indir
        run: |
          mkdir -p raw
          for i in 0 1 2 3 4 5 6; do
            d=$(TZ=Europe/Istanbul date -d "+$i day" +%F)
            curl -sSL -A "Mozilla/5.0" -o raw/$d.html -w "$d %{http_code} %{size_download}\n" "https://www.sporekrani.com/home/day/$d" || true
          done
          d=$(TZ=Europe/Istanbul date -d "+3 day" +%F)
          curl -sS -D raw/hdr2.txt -o raw/bust.html -A "Mozilla/5.0" -H "Cache-Control: no-cache" "https://www.sporekrani.com/home/day/$d?nc=$RANDOM$RANDOM" || true
          for f in constants-ByS_cEnj; do curl -sSL -o raw/$f.js "https://www.sporekrani.com/assets/$f.js" || true; done
          for ep in events events/list; do curl -sS -o "raw/api-${ep//\//_}.json" -w "$ep %{http_code}\n" "https://api.sporekrani.com/v4.1/$ep?day=$d&app_id=vunsbpYk&api_key=LltEnsF0MViM001z71NBVrZ4J8KmLqU5Ho5Mkew1" || true; done
          ls -la raw
      - name: Kaydet
        run: |
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add raw
          git diff --cached --quiet && exit 0
          git commit -m "sporekrani ham sayfalar"
          git pull --rebase origin main
          git push
