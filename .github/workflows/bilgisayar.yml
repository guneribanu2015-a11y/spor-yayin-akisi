name: Digiturk ve D-Smart (bilgisayardan)

# Türk IP'si gerektiren platformlar Banu'nun bilgisayarındaki runner'da çalışır.
# Bilgisayar kapalıysa iş sıraya girer, açılınca (24 saat içinde) kendiliğinden çalışır.
on:
  schedule:
    - cron: "30 2,14 * * *"   # Türkiye saatiyle 05:30 ve 17:30
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-yaz
  cancel-in-progress: false

jobs:
  cek:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: iptv-org/epg aracını hazırla
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $epg = Join-Path $env:RUNNER_TEMP 'epg'
          git clone -q --depth 1 https://github.com/iptv-org/epg.git $epg
          Set-Location $epg
          npm.cmd install --no-audit --no-fund --loglevel=error
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Digiturk ve D-Smart akışını çek (3 gün)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $ws = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force (Join-Path $ws 'guides') | Out-Null
          Set-Location (Join-Path $env:RUNNER_TEMP 'epg')
          npx.cmd tsx scripts/commands/epg/grab.ts "--channels=$ws\pc.channels.xml" "--output=$ws\guides\{site}.xml" --days=3 --maxConnections=3 --timeout=20000

      - name: Kaydet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "akis-bot"
          git config user.email "akis-bot@users.noreply.github.com"
          git add guides
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -q -m "Digiturk/D-Smart akışı (bilgisayar)"
            git pull -q --rebase origin main
            git push -q
          }
          exit 0

      - name: Sayfayı güncellet
        shell: powershell
        run: |
          $h = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept = "application/vnd.github+json" }
          Invoke-RestMethod -Method Post -Headers $h -ContentType "application/json" -Body '{"ref":"main"}' `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/guncelle.yml/dispatches"
